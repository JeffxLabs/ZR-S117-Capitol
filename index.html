<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <script>try{var th=new URLSearchParams(location.search).get("theme")||localStorage.getItem("s117.theme");if(th==="light"||th==="dark")document.documentElement.dataset.theme=th;}catch(e){}</script>
  <title>S117 Capitol War Intel</title>
  <meta name="description" content="Capitol War rankings, alliances and cross-event trends for Server 117 in Z Route: Redemption.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="events/i18n.js?v=db7185c9a9"></script>
  <script src="events/manifest.js?v=1b0547f6eb"></script>
  <script>
    // Preload every event in the manifest (offline/file:// support); new events need no edits here.
    (window.EVENTS_MANIFEST || []).forEach(function (ev) {
      document.write('<script src="events/' + ev.id + '/event_data.js?v=' + (ev.data_version || ev.date) + '"><\/script>');
    });
  </script>
  <style>
    /* OLED theme: true black canvas, near-black surfaces, hairline borders, no glows */
    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-2: #121212;
      --line: #1f1f1f;
      --line-2: #2e2e2e;
      --text: #f2f2f2;
      --text-2: #a3a3a3;
      --text-3: #6e6e6e;
      /* series marks (validated on #000: lightness band, chroma, CVD, contrast) */
      --home: #1aa3c2;
      --opp: #e5484d;
      --cross: #9b7bea;
      /* chrome accents for text-sized UI (pills, headings) */
      --home-ink: #5fd0e8;
      --opp-ink: #ff8a8e;
      --cross-ink: #c3b1f6;
      --gold: #f5b942;
      --up: #3fb950;
      --down: #f0605a;
      --radius: 10px;
      --header-h: 56px;
      --line-3: #3d3d3d;
      --header-bg: rgba(0,0,0,.92);
      --tooltip-bg: #161616;
      --scrim: rgba(0,0,0,.72);
      --silver: #cfd6de;
      --bronze: #d9935b;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Chakra Petch', var(--font);
    }
    /* Day mode: its own steps, validated on white (contrast >= 3:1, CVD-separated) */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f4f2;
      --surface: #ffffff;
      --surface-2: #efefec;
      --line: #e2e2de;
      --line-2: #cfcfca;
      --line-3: #a9a9a4;
      --text: #111111;
      --text-2: #4f4e4a;
      --text-3: #75746f;
      --home: #0f87a3;
      --opp: #d93b40;
      --cross: #7b5fd6;
      --home-ink: #0b6f87;
      --opp-ink: #b8262c;
      --cross-ink: #5d43b8;
      --gold: #9a6400;
      --up: #1a7f37;
      --down: #c4202a;
      --header-bg: rgba(244,244,242,.94);
      --tooltip-bg: #ffffff;
      --scrim: rgba(20,20,20,.45);
      --silver: #6b7682;
      --bronze: #a8602a;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    a { color: var(--home-ink); }
    button, input, select { font: inherit; color: inherit; }
    .wrap { max-width: 1240px; margin: 0 auto; padding-left: clamp(12px, 3vw, 24px); padding-right: clamp(12px, 3vw, 24px); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--text-2); }
    .dim { color: var(--text-3); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--home-ink); outline-offset: 2px; border-radius: 4px; }

    /* Header */
    .site-header { position: sticky; top: 0; z-index: 40; background: var(--header-bg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .header-row { display: flex; align-items: center; gap: 10px 12px; min-height: var(--header-h); flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; flex: 1 1 auto; }
        .brand-text { min-width: 0; display: block; }
    .brand-name { display: block; font: 700 16px/1.15 var(--font-display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { display: block; font-size: 12px; color: var(--text-3); }
    .controls { display: flex; gap: 8px; align-items: center; flex: 0 1 auto; min-width: 0; }
    .select, .input {
      height: 38px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; color: var(--text); min-width: 0;
    }
    .select { padding-right: 30px; appearance: none; -webkit-appearance: none; cursor: pointer; max-width: 100%; text-overflow: ellipsis;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
      background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
    .select:hover, .input:hover { border-color: var(--line-3); }
    .search { position: relative; }
    .search .input { width: clamp(200px, 22vw, 300px); padding-left: 34px; }
    .search svg { position: absolute; left: 11px; top: 11px; color: var(--text-3); pointer-events: none; }
    .search-results { position: absolute; top: 44px; right: 0; min-width: 100%; width: max(100%, 340px); max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; display: none; z-index: 60; max-height: 60vh; overflow: auto; }
    .search-results.open { display: block; }
    .sr-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border-radius: 6px; background: none; border: 0; text-align: left; cursor: pointer; }
    .sr-item[aria-selected="true"], .sr-item:hover { background: var(--surface-2); }
    .sr-kind { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-left: auto; flex: none; }
    @media (max-width: 860px) {
      .controls { flex: 1 1 100%; flex-wrap: wrap; }
      .search { flex: 1 1 100%; }
      .search .input { width: 100%; }
      .search-results { left: 0; right: 0; width: auto; }
      #eventSelect { flex: 1 1 0; }
      #langSelect { flex: 0 0 auto; }
      .brand-sub { display: none; }
    }

    /* Event bar & tabs */
    .event-bar { padding-top: clamp(18px, 3vw, 28px); padding-bottom: 14px; }
    .event-title { font: 700 clamp(22px, 4vw, 32px)/1.15 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 0 0 10px; overflow-wrap: anywhere; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; background: none; }
    .pill-home { color: var(--home-ink); border-color: rgba(26,163,194,.45); }
    .pill-opp { color: var(--opp-ink); border-color: rgba(229,72,77,.45); }
    .pill-cross { color: var(--cross-ink); border-color: rgba(155,123,234,.45); }
    .pill-xs { font-size: 11px; padding: 0 6px; margin-right: 4px; vertical-align: 1px; }
    .pill-new { color: var(--gold); border-color: rgba(245,185,66,.4); font-size: 11px; padding: 1px 7px; }
    .tabs-bar { position: sticky; top: var(--sticky-top, var(--header-h)); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; scroll-snap-align: start; background: none; border: 0; border-bottom: 2px solid transparent; padding: 14px 14px 12px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--home-ink); }
    main { padding-top: 20px; padding-bottom: 48px; }
    .view[hidden] { display: none; }

    /* Cards, tiles, sections */
    .grid { display: grid; gap: 12px; }
    .tiles { grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
    .two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; color: var(--text); }
    .card h2, .card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
    button.card { font: inherit; width: 100%; }
    button.card:hover { border-color: var(--line-2); background: var(--surface-2); }
    .section { margin-top: 16px; }
    .tile-label { font-size: 13px; color: var(--text-2); }
    .tile-value { font-size: clamp(20px, 5.2vw, 30px); font-weight: 650; letter-spacing: -.01em; margin: 4px 0 2px; overflow-wrap: anywhere; line-height: 1.2; }
    .tile-value.name { color: var(--gold); font-size: clamp(18px, 4.6vw, 24px); }
    .tile-sub { font-size: 13px; color: var(--text-3); }
    .delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
    .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--text-3); }

    /* Points balance meter */
    .balance-legend { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 14px; }
    .key { display: inline-flex; align-items: center; gap: 8px; }
    .key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
    .meter { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
    .meter span { display: block; height: 100%; }

    /* Server cards */
    .server-card { border-left: 3px solid var(--line-2); }
    .server-card.home { border-left-color: var(--home); }
    .server-card.opp { border-left-color: var(--opp); }
    .server-card h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
    .stat .v { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
    .stat .l { font-size: 12.5px; color: var(--text-3); }

    /* Ranked lists (top 10) */
    .rank-list { list-style: none; margin: 0 0 6px; padding: 0; }
    .rank-list li button { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; width: 100%; padding: 8px 4px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
    .rank-list li:first-child button { border-top: 0; }
    .rank-list li button:hover { background: var(--surface-2); }
    .rank-list .bar { grid-column: 2 / 4; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .rank-list .bar span { display: block; height: 100%; border-radius: 0 2px 2px 0; }
    .rk { font-weight: 650; color: var(--text-2); }
    .rk.m1 { color: var(--gold); } .rk.m2 { color: var(--silver); } .rk.m3 { color: var(--bronze); }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    /* Toolbars & segmented controls */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .toolbar .input { flex: 1 1 220px; max-width: 360px; }
    .segmented { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; max-width: 100%; }
    .segmented button { background: none; border: 0; padding: 8px 12px; color: var(--text-2); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
    .segmented button + button { border-left: 1px solid var(--line-2); }
    .segmented button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); text-decoration: none; font-weight: 600; font-size: 13.5px; cursor: pointer; }
    .btn:hover { border-color: var(--line-3); background: var(--surface-2); }
    .count { margin-left: auto; color: var(--text-2); font-size: 13.5px; }
    @media (max-width: 720px) { .toolbar .input { max-width: none; flex-basis: 100%; } .count { margin-left: 0; } }

    /* Tables */
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover td { background: var(--surface-2); }
    .r { text-align: right; }
    .name-cell { font-weight: 600; overflow-wrap: anywhere; }
    .sub { display: block; font-size: 12.5px; color: var(--text-3); font-weight: 400; }
    .rank-cell { white-space: nowrap; }
    .ov-tip { cursor: help; text-decoration: underline dotted; text-decoration-color: var(--line-3); text-underline-offset: 3px; }
    /* Touch screens: no hover, so the bracketed rank is tappable (bigger target, clearer underline) */
    @media (hover: none) { .ov-tip { text-decoration-color: var(--text-3); padding: 6px 4px; margin: -6px -4px; } }
    .rank-cell .overall { color: var(--text-3); font-size: 12.5px; margin-left: 4px; }
    .more-row { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }
    .show-sm { display: none; }
    @media (max-width: 720px) {
      .hide-sm { display: none !important; }
      .show-sm { display: inline; }
      th, td { padding: 9px 10px; }
    }

    /* Charts */
    .chart { width: 100%; position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .grid-line { stroke: var(--line); stroke-width: 1; }
    .chart text { fill: var(--text-2); font-size: 12px; font-family: var(--font); }
    .chart .axis-label { fill: var(--text-3); font-size: 11.5px; }
    .chart .cap { fill: var(--text); font-weight: 600; }
    .chart .hit { fill: transparent; }
    .chart .hit:focus { outline: none; }
    .chart .bar-group:hover .bar-mark, .chart .hit:focus + .bar-mark { opacity: .8; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); margin: 0 0 8px; }
    .tooltip { position: fixed; z-index: 80; pointer-events: none; background: var(--tooltip-bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: 13px; line-height: 1.4; max-width: 260px; display: none; }
    .chart-table { margin-top: 10px; }
    .link-btn { background: none; border: 0; color: var(--text-2); cursor: pointer; padding: 6px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    .trend-table .name-cell { min-width: 8.5em; overflow-wrap: normal; word-break: normal; }
    @media (max-width: 720px) { .trend-card { padding: 14px 10px; } }
    .inline-bar { display: block; height: 4px; margin-top: 4px; background: var(--surface-2); border-radius: 2px; min-width: 48px; }
    .inline-bar span { display: block; height: 100%; border-radius: 0 2px 2px 0; }

    /* Profile drawer / sheet */
    .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 70; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; z-index: 75; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--bg); border-left: 1px solid var(--line-2);
      transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; visibility: hidden; }
    .drawer.open { transform: none; visibility: visible; }
    .drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; font: 700 22px/1.2 var(--font-display); overflow-wrap: anywhere; }
    .drawer-kind { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
    .drawer-body { overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .theme-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--text-2); }
    .theme-btn:hover { border-color: var(--line-3); color: var(--text); }
    .theme-btn .sun { display: none; } :root[data-theme="light"] .theme-btn .sun { display: block; } :root[data-theme="light"] .theme-btn .moon { display: none; }
    .side { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
    .swatch-hatch { width: 12px; height: 10px; border-radius: 2px; display: inline-block; background: repeating-linear-gradient(45deg, var(--text-2) 0 2px, transparent 2px 4px); border: 1px solid var(--text-3); }
    .swatch-solid { width: 12px; height: 10px; border-radius: 2px; display: inline-block; background: var(--text-2); }
    .icon-btn[data-done] { border-color: var(--up); color: var(--up); }
    .icon-btn { margin-left: auto; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
    .drawer .tiles { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
    .drawer .tile-value { font-size: clamp(18px, 5vw, 22px); white-space: nowrap; }
    .drawer .card { padding: 14px; }
    @media (max-width: 600px) { .drawer { border-left: 0; } }

    footer { border-top: 1px solid var(--line); padding-top: 20px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); color: var(--text-3); font-size: 13px; }
    footer .langs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; }
    footer .langs button { background: none; border: 0; padding: 4px 0; color: var(--text-2); cursor: pointer; }
    footer .langs button[aria-current="true"] { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .note { font-size: 13px; color: var(--text-3); margin: 8px 0 0; }
    @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
  </style>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="wrap header-row">
      <a class="brand" href="./">
        <span class="brand-text">
          <span class="brand-name" data-i18n="brand_title">Z Route: Redemption — S117 Intel</span>
          <span class="brand-sub" data-i18n="brand_subtitle">Capitol War analytics</span>
        </span>
      </a>
      <div class="controls">
        <div class="search" role="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" class="input" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false" data-i18n-ph="search_ph" data-i18n-aria="search_ph" placeholder="Search commanders or alliances">
          <div id="searchResults" class="search-results" role="listbox"></div>
        </div>
        <label class="sr-only" for="eventSelect" data-i18n="event_label">Event</label>
        <select id="eventSelect" class="select"></select>
        <label class="sr-only" for="langSelect" data-i18n="language_label">Language</label>
        <select id="langSelect" class="select"></select>
        <button type="button" class="theme-btn" id="themeToggle" aria-pressed="false">
          <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap event-bar">
    <h1 class="event-title" id="eventTitle">Capitol War</h1>
    <div class="event-meta" id="eventMeta"></div>
  </div>

  <nav class="tabs-bar" aria-label="Sections">
    <div class="wrap tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="overview" data-i18n="tab_overview">Overview</button>
      <button class="tab" role="tab" data-tab="alliances" data-i18n="tab_alliances">Alliances</button>
      <button class="tab" role="tab" data-tab="commanders" data-i18n="tab_commanders">Commanders</button>
      <button class="tab" role="tab" data-tab="trends" data-i18n="tab_trends">Trends</button>
      <button class="tab" role="tab" data-tab="data" data-i18n="tab_data">Data</button>

  <main class="wrap">
    <section class="view" id="view-overview" role="tabpanel"></section>
    <section class="view" id="view-alliances" role="tabpanel" hidden></section>
    <section class="view" id="view-commanders" role="tabpanel" hidden></section>
    <section class="view" id="view-trends" role="tabpanel" hidden></section>
    <section class="view" id="view-data" role="tabpanel" hidden></section>
  </main>

  <footer>
    <div class="wrap">
      <span data-i18n="footer">Z Route: Redemption Capitol War intelligence · Server 117 · maintained by</span>
      <a href="https://github.com/JeffxLabs" target="_blank" rel="noopener">JeffxLabs</a>
      <div class="langs" id="footerLangs"></div>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-head">
      <div style="min-width:0">
        <div class="drawer-kind" id="drawerKind"></div>
        <h2 id="drawerTitle"></h2>
        <div class="event-meta" id="drawerMeta" style="margin-top:8px"></div>
      </div>
      <button class="icon-btn" id="drawerCopy" data-i18n-aria="copy_link" aria-label="Copy link" style="margin-left:auto">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      </button>
      <button class="icon-btn" id="drawerClose" data-i18n-aria="close" aria-label="Close" style="margin-left:0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
(function () {
  "use strict";
  // ---------- state ----------
  const I18N = window.I18N || { en: {} };
  const EVENTS = (window.EVENTS_MANIFEST || []).slice().sort((a, b) => a.date.localeCompare(b.date)); // oldest first
  const params = new URLSearchParams(location.search);
  const state = {
    lang: "en", eventId: null, tab: "overview",
    allyServer: "all", allyQuery: "",
    cmdServer: "all", cmdQuery: "", cmdLimit: 100,
    trendsTable: {}, profile: null,
  };
  const store = {};         // eventId -> {meta, alliances, rankings}
  let index = null;         // cross-event lookups, built once every event is loaded

  // ---------- i18n & formatting ----------
  function t(key, vars) {
    // Never show a raw key: missing strings render empty (asset versions are content-hashed, so this is a safety net)
    let s = (I18N[state.lang] && I18N[state.lang][key]) || (I18N.en && I18N.en[key]) || "";
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    return s;
  }
  const locale = () => (window.LANG_LOCALES || {})[state.lang] || "en-US";
  const fmt = n => (n == null || isNaN(n)) ? "—" : new Intl.NumberFormat(locale()).format(n);
  const fmtCompact = n => new Intl.NumberFormat(locale(), { notation: "compact", maximumFractionDigits: Math.abs(n) >= 1e6 ? 2 : 1 }).format(n);
  const fmtPct = (n, d = 1) => new Intl.NumberFormat(locale(), { style: "percent", maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
  const fmtDate = iso => new Intl.DateTimeFormat(locale(), { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(iso + "T00:00:00Z"));
  const fmtDateShort = iso => new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(iso + "T00:00:00Z"));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nameKey = s => String(s || "").normalize("NFKC").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  const isUnreadable = s => /^\(name unreadable/.test(s || "");
  const displayName = s => isUnreadable(s) ? t("name_unreadable") : s;

  function detectLanguage() {
    const fromUrl = (params.get("lang") || params.get("l") || "").toLowerCase().split(/[-_]/)[0];
    if (I18N[fromUrl]) return fromUrl;
    try { const saved = localStorage.getItem("s117.lang"); if (saved && I18N[saved]) return saved; } catch (e) {}
    for (const l of (navigator.languages || [navigator.language || "en"])) {
      const code = String(l).toLowerCase().split(/[-_]/)[0];
      if (I18N[code]) return code;
    }
    return "en";
  }

  // ---------- event roles ----------
  const ev = () => store[state.eventId] || { meta: {}, alliances: [], rankings: [] };
  function roles(meta) {
    meta = meta || ev().meta;
    const home = String(meta.home_server || "117"), opp = String(meta.opponent_server || "");
    const homeRole = meta.home_role || null;
    const oppRole = homeRole ? (homeRole === "defending" ? "attacking" : "defending") : null;
    const others = Object.keys(meta.servers || {}).filter(s => s !== home && s !== opp).sort();
    return { home, opp, homeRole, oppRole, others };
  }
  function serverClass(server, meta) {
    const r = roles(meta);
    return String(server) === r.home ? "home" : String(server) === r.opp ? "opp" : "cross";
  }
  const serverColor = (server, meta) => `var(--${serverClass(server, meta)})`;
  // Which side a server fought on in an event: "attacking" | "defending" | null (cross-server / unknown)
  function sideOf(e, server) {
    const m = (store[e.id] && store[e.id].meta) || e;
    const r = roles(m);
    return String(server) === r.home ? r.homeRole : String(server) === r.opp ? r.oppRole : null;
  }
  // Points run systematically higher or lower on attacking vs defending days, so points-based changes
  // only compare with the most recent earlier event where that server fought on the SAME side.
  // Rank/position changes (relative within a day) compare with the immediately previous event.
  function sameSideBaseline(eventId, server) {
    const i = EVENTS.findIndex(e => e.id === eventId); if (i < 0) return null;
    const side = sideOf(EVENTS[i], server); if (!side) return null;
    for (let j = i - 1; j >= 0; j--) if (store[EVENTS[j].id] && sideOf(EVENTS[j], server) === side) return EVENTS[j];
    return null;
  }
  const dayWord = side => side ? t("day_" + side) : "";
  function vsSameSide(eventId, server, base) {
    const side = sideOf(EVENTS.find(e => e.id === eventId) || {}, server);
    if (!side) return "";
    // Without a same-side baseline the tile simply shows no comparison line
    return base ? `<span class="dim">${esc(t("vs_last_day", { day: dayWord(side), date: fmtDateShort(base.date) }))}</span>` : "";
  }
  const sideHtml = side => side ? `<span class="side"><span aria-hidden="true">${roleIcon(side)}</span>${esc(t("role_" + side))}</span>` : "";
  const sideShort = side => side ? `${roleIcon(side)} ${t("role_" + side)}` : "";
  const sideKey = () => `<div class="legend"><span class="key"><span class="swatch-solid"></span>${esc(t("legend_attacking"))}</span><span class="key"><span class="swatch-hatch"></span>${esc(t("legend_defending"))}</span></div>`;
  const serverPill = (server, meta, xs) => `<span class="pill pill-${serverClass(server, meta)}${xs ? " pill-xs" : ""}">S${esc(server)}</span>`;
  const roleIcon = role => role === "defending" ? "🛡️" : "⚔️";

  // ---------- data loading & cross-event index ----------
  function loadEvent(id) {
    if (store[id]) return Promise.resolve(store[id]);
    const v = window["EVENT_" + id.replace(/-/g, "_")];
    if (v) { store[id] = v; return Promise.resolve(v); }
    return Promise.all(["event.json", "alliances.json", "rankings.json"].map(f => fetch(`events/${id}/${f}`).then(r => r.json())))
      .then(([meta, alliances, rankings]) => (store[id] = { meta, alliances, rankings }));
  }
  const prevEventOf = id => { const i = EVENTS.findIndex(e => e.id === id); return i > 0 ? EVENTS[i - 1] : null; };
  // Commanders match across events by server + name (ignoring decorative symbols); alliances by server + tag
  const cKey = p => `${p.server}|${nameKey(p.commander)}`;
  const aKey = a => `${a.server}|${(a.tag || a.alliance || "").toLowerCase()}`;
  const keyToUrl = k => k.replace("|", ".");
  const keyFromUrl = v => v ? (v.includes("|") ? v : v.replace(".", "|")) : null;
  const allyTag = s => { const m = /^\[([^\]]+)\]/.exec(s || ""); return m ? m[1] : ""; };

  function buildIndex() {
    const idx = { c: {}, a: {} };
    for (const e of EVENTS) {
      const d = store[e.id]; if (!d) continue;
      for (const p of d.rankings) {
        if (isUnreadable(p.commander)) continue;
        (idx.c[cKey(p)] = idx.c[cKey(p)] || {})[e.id] = p;
      }
      for (const a of d.alliances) (idx.a[aKey(a)] = idx.a[aKey(a)] || {})[e.id] = a;
    }
    return idx;
  }
  const allyOfPlayer = (p, eventId) => store[eventId].alliances.find(a => a.alliance === p.alliance && a.server === p.server) || null;

  // ---------- small render helpers ----------
  // Bracketed number = overall rank across all servers (hover explains it)
  const overall = (r, cls = "overall", style = "") => `<span class="${cls} ov-tip" tabindex="0" role="button"${style ? ` style="${style}"` : ""} title="${esc(t("overall_tip"))}" aria-label="${esc(t("overall_short", { n: r }))}">(${r})</span>`;
  const rankClass = r => r === 1 ? "m1" : r === 2 ? "m2" : r === 3 ? "m3" : "";
  function deltaHtml(cur, prev, { compact = false } = {}) {
    if (prev == null || cur == null) return "";
    const d = cur - prev;
    const cls = d === 0 ? "flat" : d > 0 ? "up" : "down";
    const arrow = d === 0 ? "■" : d > 0 ? "▲" : "▼";
    const txt = d === 0 ? "0" : (compact ? fmtCompact(Math.abs(d)) : fmt(Math.abs(d)));
    return `<span class="delta ${cls}">${arrow} ${txt}</span>`;
  }
  function rankMoveHtml(curRank, prevRank, visibleLabel) {
    if (prevRank == null) return `<span class="pill pill-new">${esc(t("new_badge"))}</span>`;
    const d = prevRank - curRank;
    if (d === 0) return visibleLabel ? `<span class="delta flat">■ ${esc(t("no_change"))}</span>`
      : `<span class="delta flat" title="${esc(t("no_change"))}">■<span class="sr-only">${esc(t("no_change"))}</span></span>`;
    if (visibleLabel) return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${esc(d > 0 ? t("moved_up", { n: d }) : t("moved_down", { n: -d }))}</span>`;
    const label = d > 0 ? t("moved_up", { n: d }) : t("moved_down", { n: -d });
    return `<span class="delta ${d > 0 ? "up" : "down"}" title="${esc(label)}"><span aria-hidden="true">${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d))}</span><span class="sr-only">${esc(label)}</span></span>`;
  }
  const nEvents = n => t(new Intl.PluralRules(locale()).select(n) === "one" ? "n_events_one" : "n_events_other", { n: fmt(n) });
  const tile = (label, value, sub, cls = "") =>
    `<div class="card"><div class="tile-label">${esc(label)}</div><div class="tile-value ${cls}">${value}</div><div class="tile-sub">${sub || ""}</div></div>`;

  // ---------- charts (inline SVG: one axis, thin marks, hover + focus tooltips) ----------
  const tip = document.getElementById("tooltip");
  function showTip(html, x, y) {
    tip.innerHTML = html; tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 12)) + "px";
    tip.style.top = Math.max(8, y - r.height - 12) + "px";
  }
  const hideTip = () => { tip.style.display = "none"; };
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y, w, h, r) {   // 4px rounded data-end, square at the baseline
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  let chartSeq = 0;
  /** Grouped column chart. groups: [{label, sub}]; series: [{label, color (CSS colour or var), values, tips, hatch: [bool]}]
      Hatched bars mark the defending side (texture is the secondary channel, colour stays the server). */
  function columnChart(el, groups, series, { height = 230 } = {}) {
    const cid = "c" + (++chartSeq);
    const W = Math.max(260, Math.floor(el.clientWidth || 600)), H = height;
    const m = { l: 50, r: 8, t: 22, b: groups.some(g => g.sub2) ? 56 : groups.some(g => g.sub) ? 40 : 26 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const max = niceMax(Math.max(0, ...series.flatMap(s => s.values.filter(v => v != null))) * 1.08);
    const band = pw / groups.length, gap = 2;
    const bw = Math.min(24, Math.max(6, (band * 0.62 - gap * (series.length - 1)) / series.length));
    const y = v => m.t + ph - (v / max) * ph;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><defs>${series.map((s, si) =>
      `<pattern id="${cid}-h${si}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:${s.color};opacity:.28"/><rect width="3" height="6" style="fill:${s.color}"/></pattern>`).join("")}</defs>`;
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      svg += `<line class="grid-line" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/><text class="axis-label" x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${esc(fmtCompact(v))}</text>`;
    }
    // Selective labels: every cap for a single short series, otherwise only the latest group
    const labelCap = gi => series.length === 1 ? groups.length <= 6 : gi === groups.length - 1;
    groups.forEach((g, gi) => {
      const gx = m.l + band * gi + (band - (bw * series.length + gap * (series.length - 1))) / 2;
      series.forEach((s, si) => {
        const v = s.values[gi]; if (v == null) return;
        const x = gx + si * (bw + gap), yy = y(v), h = Math.max(1, m.t + ph - yy);
        const tipHtml = s.tips ? s.tips[gi] : `<b>${esc(s.label)}</b><br>${esc(g.label)}: ${esc(fmt(v))}`;
        svg += `<g class="bar-group"><rect class="hit" x="${x - 4}" y="${m.t}" width="${bw + 8}" height="${ph}" tabindex="0" data-tip="${esc(tipHtml)}"></rect>`;
        const fill = s.hatch && s.hatch[gi] ? `url(#${cid}-h${si})` : s.color;
        svg += `<path class="bar-mark" d="${barPath(x, yy, bw, h, 4)}" style="fill:${fill}"/></g>`;
        // A cap label is drawn only where it fits over its own bar; the tooltip and data table carry the rest
        const capText = fmtCompact(v), capW = capText.length * 6.8;
        if (labelCap(gi) && (series.length === 1 || capW <= bw + gap + 2)) svg += `<text class="cap" x="${x + bw / 2}" y="${yy - 6}" text-anchor="middle">${esc(capText)}</text>`;
      });
      const cx = m.l + band * gi + band / 2;
      svg += `<text x="${cx}" y="${H - m.b + 16}" text-anchor="middle">${esc(g.label)}</text>`;
      if (g.sub) svg += `<text class="axis-label" x="${cx}" y="${H - m.b + 31}" text-anchor="middle">${esc(g.sub)}</text>`;
      if (g.sub2) svg += `<text class="axis-label" x="${cx}" y="${H - m.b + 46}" text-anchor="middle">${esc(g.sub2)}</text>`;
    });
    el.innerHTML = svg + `</svg>`;
    el.querySelectorAll(".hit").forEach(h => {
      const show = e => { const r = h.getBoundingClientRect(); showTip(h.dataset.tip, e ? e.clientX : r.left + r.width / 2, e ? e.clientY : r.top + 20); };
      h.addEventListener("mousemove", show); h.addEventListener("focus", () => show());
      h.addEventListener("mouseleave", hideTip); h.addEventListener("blur", hideTip);
    });
  }
  const legendHtml = items => `<div class="legend">${items.map(i => `<span class="key"><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join("")}</div>`;
  const charts = [];
  function registerChart(el, fn) { charts.push({ el, fn }); fn(); }
  let resizeTimer, lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { measureHeader(); if (window.innerWidth !== lastW) { lastW = window.innerWidth; charts.forEach(c => document.body.contains(c.el) && c.fn()); } }, 150);
  });
  function measureHeader() {
    const h = document.getElementById("siteHeader").offsetHeight;
    document.documentElement.style.setProperty("--sticky-top", h + "px");
  }

  // ---------- header, event bar, tabs ----------
  function applyStaticText() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    const names = window.LANG_NAMES || {};
    document.getElementById("langSelect").innerHTML = Object.keys(I18N).map(l => `<option value="${l}" ${l === state.lang ? "selected" : ""}>${esc(names[l] || l)}</option>`).join("");
    document.getElementById("footerLangs").innerHTML = Object.keys(I18N).map(l => `<button type="button" lang="${l}" data-lang="${l}" aria-current="${l === state.lang}">${esc(names[l] || l)}</button>`).join("");
    document.getElementById("eventSelect").innerHTML = EVENTS.slice().reverse().map(e =>
      `<option value="${e.id}" ${e.id === state.eventId ? "selected" : ""}>${esc(t("event_option", { date: fmtDate(e.date), home: e.home_server, opp: e.opponent_server }))}</option>`).join("");
    measureHeader();
  }
  function renderEventBar() {
    const m = ev().meta, r = roles();
    const title = t("event_title", { home: r.home, opp: r.opp });
    document.getElementById("eventTitle").textContent = title;
    document.title = `${title} · ${t("brand_short")}`;
    const parts = [`<span class="pill">${esc(fmtDate(m.date || state.eventId.slice(0, 10)))}</span>`];
    if (r.homeRole) {
      parts.push(`<span class="pill pill-home"><span aria-hidden="true">${roleIcon(r.homeRole)}</span> S${esc(r.home)} · ${esc(t("role_" + r.homeRole))}</span>`);
      parts.push(`<span class="pill pill-opp"><span aria-hidden="true">${roleIcon(r.oppRole)}</span> S${esc(r.opp)} · ${esc(t("role_" + r.oppRole))}</span>`);
    }
    document.getElementById("eventMeta").innerHTML = parts.join("");
  }
  function setTab(tab, sync = true) {
    if (sync && tab !== state.tab && state.profile) { state.profile = null; drawer.classList.contains("open") && closeDrawer(true); }
    state.tab = tab;
    document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === tab; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
    document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + tab; });
    renderTab();
    if (sync) syncUrl(true);
  }
  // Every view is addressable: ?event= &tab= &lang= &theme= &srv= (server filter) &q= (filter text) &c= / &a= (profile)
  function viewUrl() {
    const u = new URL(location.href);
    ["event", "tab", "lang", "l", "theme", "srv", "q", "c", "a"].forEach(k => u.searchParams.delete(k));
    u.searchParams.set("event", state.eventId);
    if (state.tab !== "overview") u.searchParams.set("tab", state.tab);
    u.searchParams.set("lang", state.lang);
    const filt = state.tab === "alliances" ? [state.allyServer, state.allyQuery] : state.tab === "commanders" ? [state.cmdServer, state.cmdQuery] : ["all", ""];
    if (filt[0] !== "all") u.searchParams.set("srv", filt[0]);
    if (filt[1]) u.searchParams.set("q", filt[1]);
    if (document.documentElement.dataset.theme === "light") u.searchParams.set("theme", "light");
    if (state.profile) u.searchParams.set(state.profile.type, keyToUrl(state.profile.key));
    return u;
  }
  let restoring = false;
  function syncUrl(push) {
    if (restoring) return;
    try {
      const u = viewUrl();
      if (u.href === location.href) return;
      push ? history.pushState(null, "", u) : history.replaceState(null, "", u);
    } catch (e) {}
  }
  function readUrlState(p) {
    const aliases = { players: "commanders", export: "data" }, qTab = aliases[p.get("tab")] || p.get("tab");
    state.tab = ["overview", "alliances", "commanders", "trends", "data"].includes(qTab) ? qTab : "overview";
    state.eventId = (EVENTS.find(e => e.id === p.get("event")) || EVENTS[EVENTS.length - 1] || {}).id;
    const srv = p.get("srv") || "all", q = p.get("q") || "";
    state.allyServer = state.tab === "alliances" ? srv : "all"; state.allyQuery = state.tab === "alliances" ? q : "";
    state.cmdServer = state.tab === "commanders" ? srv : "all"; state.cmdQuery = state.tab === "commanders" ? q : ""; state.cmdLimit = 100;
  }
  function openProfileFromUrl(p) {
    const c = keyFromUrl(p.get("c")), a = keyFromUrl(p.get("a"));
    if (c) openCommander(c); else if (a) openAlliance(a);
    else if (drawer.classList.contains("open")) closeDrawer(true);
  }
  window.addEventListener("popstate", () => {
    const p = new URLSearchParams(location.search);
    restoring = true;
    readUrlState(p);
    const lang = (p.get("lang") || "").toLowerCase();
    if (I18N[lang]) state.lang = lang;
    const th = p.get("theme"); applyTheme(th === "light" ? "light" : (th === "dark" ? "dark" : document.documentElement.dataset.theme));
    loadEvent(state.eventId).then(() => { renderAll(); openProfileFromUrl(p); restoring = false; });
  });

  // ---------- overview ----------
  function renderOverview() {
    const d = ev(), m = d.meta, r = roles();
    const base = sameSideBaseline(state.eventId, r.home), pm = base && store[base.id].meta;
    const servers = m.servers || {};
    const empty = { points: 0, players: 0, point_share_pct: 0 };
    const home = servers[r.home] || empty, opp = servers[r.opp] || empty;
    const others = r.others.reduce((a, k) => ({ points: a.points + servers[k].points, pct: a.pct + servers[k].point_share_pct }), { points: 0, pct: 0 });
    const vsPrev = vsSameSide(state.eventId, r.home, base);
    const top = d.rankings[0];
    const tiles = [
      tile(t("kpi_points"), fmt(m.total_points), pm ? `${deltaHtml(m.total_points, pm.total_points, { compact: true })} ${vsPrev}` : vsPrev),
      tile(t("kpi_commanders"), fmt(m.total_players), pm ? `${deltaHtml(m.total_players, pm.total_players)} ${vsPrev}` : vsPrev),
      tile(t("kpi_alliances"), fmt(m.unique_alliances), pm ? `${deltaHtml(m.unique_alliances, pm.unique_alliances)} ${vsPrev}` : vsPrev),
      top ? `<button class="card" style="text-align:left;cursor:pointer" data-open-c="${esc(cKey(top))}"><div class="tile-label">${esc(t("kpi_top"))}</div><div class="tile-value name">${esc(displayName(top.commander))}</div><div class="tile-sub">${esc(top.alliance || "")} · <span class="num">${fmt(top.points)}</span> ${esc(t("pts"))}</div></button>` : "",
    ].join("");

    const seg = (pct, color) => pct > 0 ? `<span style="width:${pct}%;background:${color}"></span>` : "";
    const balance = `<div class="card section"><h2>${esc(t("balance_title"))}</h2>
      <div class="balance-legend">
        <span class="key"><i style="background:var(--home)"></i>S${esc(r.home)} <b class="num">${fmtCompact(home.points)}</b> <span class="muted num">${fmtPct(home.point_share_pct / 100)}</span></span>
        ${others.points > 0 ? `<span class="key"><i style="background:var(--cross)"></i>${esc(t("role_cross"))} <span class="muted num">${fmtPct(others.pct / 100)}</span></span>` : ""}
        <span class="key"><i style="background:var(--opp)"></i>S${esc(r.opp)} <b class="num">${fmtCompact(opp.points)}</b> <span class="muted num">${fmtPct(opp.point_share_pct / 100)}</span></span>
      </div>
      <div class="meter" role="img" aria-label="S${esc(r.home)} ${fmtPct(home.point_share_pct / 100)} · S${esc(r.opp)} ${fmtPct(opp.point_share_pct / 100)}">
        ${seg(home.point_share_pct, "var(--home)")}${seg(others.pct, "var(--cross)")}${seg(opp.point_share_pct, "var(--opp)")}
      </div></div>`;

    const card = (srv, s, cls, role) => {
      const topA = d.alliances.find(a => a.server === srv);
      const avg = s.players ? Math.round(s.points / s.players) : 0;
      const sBase = sameSideBaseline(state.eventId, srv), sm = sBase && store[sBase.id].meta;
      const prevS = sm && sm.servers && sm.servers[srv];
      return `<div class="card server-card ${cls}">
        <h3><span>${esc(t("server_n", { n: srv }))}${role ? ` · ${esc(t("role_" + role))}` : ""}</span>${serverPill(srv)}</h3>
        <div class="stats">
          <div class="stat"><div class="l">${esc(t("total_points"))}</div><div class="v num">${fmt(s.points)}</div><div class="l">${esc(t("share_of_points", { p: fmtPct(s.point_share_pct / 100) }))}</div></div>
          <div class="stat"><div class="l">${esc(t("participants"))}</div><div class="v num">${fmt(s.players)}</div><div class="l">${esc(t("share_of_roster", { p: fmtPct(m.total_players ? s.players / m.total_players : 0) }))}</div></div>
          <div class="stat"><div class="l">${esc(t("avg_per_player"))}</div><div class="v num">${fmt(avg)}</div>${prevS && prevS.players ? `<div class="l">${deltaHtml(avg, Math.round(prevS.points / prevS.players), { compact: true })} ${vsSameSide(state.eventId, srv, sBase)}</div>` : ""}</div>
          <div class="stat"><div class="l">${esc(t("top_alliance"))}</div>${topA ? `<button class="link-btn" style="color:var(--gold);font-weight:650;text-decoration:none;padding:0;font-size:17px;text-align:left" data-open-a="${esc(aKey(topA))}">${esc(topA.alliance)}</button><div class="l num">${fmtCompact(topA.total_points)} ${esc(t("pts"))}</div>` : "—"}</div>
        </div></div>`;
    };
    const topList = (srv, cls) => {
      const list = d.alliances.filter(a => a.server === srv).slice(0, 10);
      const max = list.length ? list[0].total_points : 1;
      return `<div class="card"><h2>${esc(t("top10_server", { n: srv }))}</h2><ol class="rank-list">${list.map((a, i) => `
        <li><button data-open-a="${esc(aKey(a))}">
          <span class="rk ${rankClass(i + 1)}">#${i + 1}</span>
          <span class="ellipsis"><b>${esc(a.alliance)}</b> <span class="dim">· ${fmt(a.members_count)}</span></span>
          <span class="num">${fmt(a.total_points)}</span>
          <span class="bar"><span style="width:${(a.total_points / max * 100).toFixed(1)}%;background:var(--${cls})"></span></span>
        </button></li>`).join("")}</ol>
        <button class="link-btn" data-goto="alliances" data-server="${esc(srv)}">${esc(t("view_all"))} →</button></div>`;
    };
    document.getElementById("view-overview").innerHTML =
      `<div class="grid tiles">${tiles}</div>${balance}
       <div class="grid two section">${card(r.home, home, "home", r.homeRole)}${card(r.opp, opp, "opp", r.oppRole)}</div>
       <div class="grid two section">${topList(r.home, "home")}${topList(r.opp, "opp")}</div>`;
  }

  // ---------- alliances ----------
  function serverFilter(current, attr) {
    const r = roles();
    const opts = ["all", r.home, r.opp, ...r.others].filter(Boolean);
    return `<div class="segmented" role="group" aria-label="${esc(t("col_server"))}">${opts.map(s => `<button type="button" ${attr}="${esc(s)}" aria-pressed="${current === s}">${s === "all" ? esc(t("all_servers")) : "S" + esc(s)}</button>`).join("")}</div>`;
  }
  function liveFilter(id, onChange) {
    const qi = document.getElementById(id);
    qi.addEventListener("input", () => { const v = qi.value, pos = qi.selectionStart; onChange(v.trim()); const n = document.getElementById(id); n.focus(); n.setSelectionRange(pos, pos); });
  }
  function prevNote() {
    const prev = prevEventOf(state.eventId); if (!prev || !store[prev.id]) return "";
    const r = roles(), side = sideOf(EVENTS.find(e => e.id === state.eventId), r.home), base = sameSideBaseline(state.eventId, r.home);
    const pts = base ? t("compare_note_pts", { day: dayWord(side), date: fmtDate(base.date) }) : t("compare_note_none", { day: dayWord(side) });
    const rank = t("compare_note_rank", { date: fmtDate(prev.date), day: dayWord(sideOf(prev, r.home)) });
    return `<p class="note" style="margin:0 0 10px">S${esc(r.home)}: ${esc(pts)} ${esc(rank)}</p>`;
  }
  // Points change for an entity against its same-side baseline (empty when there is none)
  function sameSidePointsDelta(byEvKind, key, server, value, field) {
    const base = sameSideBaseline(state.eventId, server); if (!base || !index) return "";
    const v = (index[byEvKind][key] || {})[base.id];
    return v ? deltaHtml(value, v[field], { compact: true }) : "";
  }
  function renderAlliances() {
    const d = ev(), prev = prevEventOf(state.eventId), pd = prev && store[prev.id];
    const q = state.allyQuery.toLowerCase(), filtered = state.allyServer !== "all";
    const list = d.alliances.filter(a => (!filtered || a.server === state.allyServer) && (!q || a.alliance.toLowerCase().includes(q)));
    const prevA = a => (pd && index) ? (index.a[aKey(a)] || {})[prev.id] : null;
    const rows = list.map(a => {
      const p = prevA(a), rk = filtered ? a.server_rank : a.rank;
      return `<tr class="clickable" data-open-a="${esc(aKey(a))}" tabindex="0">
        <td class="rank-cell"><span class="rk ${rankClass(rk)}">#${rk}</span>${filtered ? overall(a.rank) : ""}</td>
        <td class="name-cell">${esc(a.alliance)}<span class="sub"><span class="show-sm">${serverPill(a.server, null, true)}<span class="num">${fmt(a.members_count)}</span> · </span>${esc(displayName(a.top_commander))}</span></td>
        <td class="hide-sm">${serverPill(a.server)}</td>
        <td class="r num hide-sm">${fmt(a.members_count)}</td>
        <td class="r num"><b>${fmt(a.total_points)}</b><span class="sub">${sameSidePointsDelta("a", aKey(a), a.server, a.total_points, "total_points")}${pd ? `<span class="show-sm"> ${p ? rankMoveHtml(a.rank, p.rank) : `<span class="pill pill-new">${esc(t("new_badge"))}</span>`}</span>` : ""}</span></td>
        <td class="r num hide-sm">${fmt(a.avg_points)}</td>
        <td class="r hide-sm">${pd ? (p ? rankMoveHtml(a.rank, p.rank) : `<span class="pill pill-new">${esc(t("new_badge"))}</span>`) : "—"}</td>
      </tr>`;
    }).join("");
    document.getElementById("view-alliances").innerHTML = `
      <div class="toolbar">
        <input class="input" type="search" id="allyQuery" value="${esc(state.allyQuery)}" placeholder="${esc(t("filter_alliances_ph"))}" aria-label="${esc(t("filter_alliances_ph"))}">
        ${serverFilter(state.allyServer, "data-ally-srv")}
        <span class="count">${esc(t("showing_alliances", { n: fmt(list.length) }))}</span>
        <a class="btn" href="events/${esc(state.eventId)}/alliances.csv" download="${esc(state.eventId)}-alliances.csv">${esc(t("download_csv"))}</a>
      </div>
      ${prevNote()}${filtered ? `<p class="note" style="margin:0 0 10px">${esc(t("rank_hint"))}</p>` : ""}
      <div class="table-wrap"><table>
        <thead><tr><th>${esc(t("col_rank"))}</th><th>${esc(t("col_alliance"))}</th><th class="hide-sm">${esc(t("col_server"))}</th>
        <th class="r hide-sm">${esc(t("col_members"))}</th><th class="r">${esc(t("col_total"))}</th><th class="r hide-sm">${esc(t("col_avg"))}</th><th class="r hide-sm">${esc(t("col_rank_prev"))}</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    liveFilter("allyQuery", v => { state.allyQuery = v; renderAlliances(); syncUrl(false); });
  }

  // ---------- commanders ----------
  function renderCommanders() {
    const d = ev(), prev = prevEventOf(state.eventId), pd = prev && store[prev.id];
    const q = state.cmdQuery.toLowerCase(), filtered = state.cmdServer !== "all";
    const list = d.rankings.filter(p => (!filtered || p.server === state.cmdServer) && (!q || (p.commander || "").toLowerCase().includes(q) || (p.alliance || "").toLowerCase().includes(q)));
    const shown = list.slice(0, state.cmdLimit);
    const rows = shown.map(p => {
      const pp = (pd && index) ? (index.c[cKey(p)] || {})[prev.id] : null;
      const rk = filtered ? p.server_rank : p.rank;
      return `<tr class="clickable" data-open-c="${esc(cKey(p))}" tabindex="0">
        <td class="rank-cell"><span class="rk ${rankClass(rk)}">#${rk}</span>${filtered ? overall(p.rank) : ""}</td>
        <td class="name-cell">${esc(displayName(p.commander))}<span class="sub"><span class="show-sm">${serverPill(p.server, null, true)}</span>${esc(p.alliance || "")}</span></td>
        <td class="hide-sm">${serverPill(p.server)}</td>
        <td class="r num"><b>${fmt(p.points)}</b>${pd ? `<span class="sub"><span class="hide-sm">${sameSidePointsDelta("c", cKey(p), p.server, p.points, "points")}</span><span class="show-sm">${rankMoveHtml(p.rank, pp ? pp.rank : null)}</span></span>` : ""}</td>
        <td class="r hide-sm">${pd ? rankMoveHtml(p.rank, pp ? pp.rank : null) : "—"}</td>
      </tr>`;
    }).join("");
    document.getElementById("view-commanders").innerHTML = `
      <div class="toolbar">
        <input class="input" type="search" id="cmdQuery" value="${esc(state.cmdQuery)}" placeholder="${esc(t("filter_commanders_ph"))}" aria-label="${esc(t("filter_commanders_ph"))}">
        ${serverFilter(state.cmdServer, "data-cmd-srv")}
        <span class="count">${esc(t("showing_commanders", { n: fmt(list.length) }))}</span>
        <a class="btn" href="events/${esc(state.eventId)}/rankings.csv" download="${esc(state.eventId)}-rankings.csv">${esc(t("download_csv"))}</a>
      </div>
      ${prevNote()}${filtered ? `<p class="note" style="margin:0 0 10px">${esc(t("rank_hint"))}</p>` : ""}
      <div class="table-wrap"><table>
        <thead><tr><th>${esc(t("col_rank"))}</th><th>${esc(t("col_commander"))}</th><th class="hide-sm">${esc(t("col_server"))}</th>
        <th class="r">${esc(t("col_points"))}</th><th class="r hide-sm">${esc(t("col_rank_prev"))}</th></tr></thead>
        <tbody>${rows}</tbody></table>
        ${list.length > shown.length ? `<div class="more-row"><button class="btn" id="cmdMore">${esc(t("load_more"))} · ${fmt(shown.length)} / ${fmt(list.length)}</button></div>` : ""}
      </div>`;
    liveFilter("cmdQuery", v => { state.cmdQuery = v; state.cmdLimit = 100; renderCommanders(); syncUrl(false); });
    const more = document.getElementById("cmdMore");
    if (more) more.addEventListener("click", () => { state.cmdLimit += 200; renderCommanders(); });
  }

  // ---------- trends (longitudinal) ----------
  function renderTrends() {
    const el = document.getElementById("view-trends");
    const loaded = EVENTS.filter(e => store[e.id]);
    if (loaded.length < 2 || !index) {
      el.innerHTML = `<div class="card"><p class="muted" style="margin:0">${esc(t("trends_need_two"))}</p></div>`;
      return;
    }
    const homeSrv = String(loaded[loaded.length - 1].home_server || "117");
    const groups = loaded.map(e => ({ label: fmtDateShort(e.date), sub: `${sideShort(sideOf(e, e.home_server))} · vs S${e.opponent_server}` }));
    const S = e => store[e.id].meta.servers || {};
    const series = (srvOf, field) => loaded.map(e => (S(e)[srvOf(e)] || {})[field] || 0);
    const homePts = series(e => e.home_server, "points"), oppPts = series(e => e.opponent_server, "points");
    const homeN = series(e => e.home_server, "players"), oppN = series(e => e.opponent_server, "players");
    const tips = (srvOf, vals) => loaded.map((e, i) => `<b>S${esc(srvOf(e))}</b> · ${esc(sideShort(sideOf(e, srvOf(e))))}<br>${esc(fmtDate(e.date))}: <span class="num">${esc(fmt(vals[i]))}</span>`);
    const homeLabel = t("legend_home", { n: homeSrv }), oppLabel = t("legend_opponent");
    const legend = legendHtml([{ color: "var(--home)", label: homeLabel }, { color: "var(--opp)", label: oppLabel }]) + sideKey();
    const evHead = loaded.map(e => `<th class="r">${esc(fmtDateShort(e.date))}<span class="sub" style="text-transform:none;letter-spacing:0">${sideHtml(sideOf(e, e.home_server))} · vs S${esc(e.opponent_server)}</span></th>`).join("");
    const dataTable = (key, rowsHtml) => `<div class="chart-table" ${state.trendsTable[key] ? "" : "hidden"}><div class="table-wrap"><table><thead><tr><th>${esc(t("col_server"))}</th>${evHead}</tr></thead><tbody>${rowsHtml}</tbody></table></div></div>
      <button class="link-btn" data-toggle-table="${key}" aria-expanded="${!!state.trendsTable[key]}">${esc(state.trendsTable[key] ? t("hide_table") : t("show_table"))}</button>`;
    const valRow = (label, vals) => `<tr><td>${esc(label)}</td>${vals.map(v => `<td class="r num">${fmt(v)}</td>`).join("")}</tr>`;

    const lastId = loaded[loaded.length - 1].id;
    const baseE = sameSideBaseline(lastId, homeSrv), baseIdx = baseE ? loaded.findIndex(e => e.id === baseE.id) : -1;
    const lastSide = sideOf(loaded[loaded.length - 1], homeSrv);
    const bySide = ["attacking", "defending"].map(side => {
      const evs = loaded.filter(e => sideOf(e, e.home_server) === side);
      const pts = evs.map(e => (S(e)[e.home_server] || {}).points || 0), ppl = evs.map(e => (S(e)[e.home_server] || {}).players || 0);
      const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
      return { side, n: evs.length, pts: avg(pts), ppl: avg(ppl), per: evs.length ? Math.round(pts.reduce((x, y) => x + y, 0) / Math.max(1, ppl.reduce((x, y) => x + y, 0))) : null };
    });
    const allyRows = Object.entries(index.a).filter(([k, byEv]) => k.startsWith(homeSrv + "|") && !Object.values(byEv).some(a => a.alliance === "No Alliance")).map(([k, byEv]) => {
      const vals = loaded.map(e => byEv[e.id] ? byEv[e.id].total_points : null);
      const ref = byEv[lastId] || Object.values(byEv).pop();
      return { k, name: ref.alliance, vals };
    }).sort((a, b) => (b.vals[b.vals.length - 1] || 0) - (a.vals[a.vals.length - 1] || 0) || (b.vals[b.vals.length - 2] || 0) - (a.vals[a.vals.length - 2] || 0)).slice(0, 15);
    const maxA = Math.max(1, ...allyRows.flatMap(r => r.vals.filter(v => v != null)));

    const cmdRows = Object.entries(index.c).filter(([k]) => k.startsWith(homeSrv + "|")).map(([k, byEv]) => {
      const cells = loaded.map(e => byEv[e.id] || null);
      return { k, cells, ref: cells[cells.length - 1] || cells.filter(Boolean).pop(), n: cells.filter(Boolean).length };
    }).filter(r => r.n >= 2).sort((a, b) => ((b.cells[b.cells.length - 1] || {}).points || 0) - ((a.cells[a.cells.length - 1] || {}).points || 0)).slice(0, 25);

    el.innerHTML = `
      <p class="note" style="margin:0 0 12px">${esc(t("events_n", { n: loaded.length }))} · ${esc(t("trends_note"))}</p>
      <div class="grid two">
        <div class="card"><h2>${esc(t("trends_server_points"))}</h2>${legend}<div class="chart" id="chPts"></div>
          ${dataTable("pts", valRow(homeLabel, homePts) + valRow(oppLabel, oppPts))}</div>
        <div class="card"><h2>${esc(t("trends_participation"))}</h2>${legend}<div class="chart" id="chN"></div>
          ${dataTable("n", valRow(homeLabel, homeN) + valRow(oppLabel, oppN))}</div>
      </div>
      <div class="card section"><h2>${esc(t("trends_by_side", { home: homeSrv }))}</h2>
        <div class="table-wrap" style="border:0"><table><thead><tr><th>${esc(t("col_side"))}</th><th class="r">${esc(t("side_events"))}</th><th class="r">${esc(t("total_points"))}</th><th class="r">${esc(t("participants"))}</th><th class="r hide-sm">${esc(t("avg_per_player"))}</th></tr></thead>
        <tbody>${bySide.map(b => `<tr><td>${sideHtml(b.side)}</td><td class="r num">${fmt(b.n)}</td><td class="r num">${b.pts != null ? fmt(b.pts) : "—"}</td><td class="r num">${b.ppl != null ? fmt(b.ppl) : "—"}</td><td class="r num hide-sm">${b.per != null ? fmt(b.per) : "—"}</td></tr>`).join("")}</tbody></table></div>
        <p class="note">${esc(baseE ? t("compare_note_pts", { day: dayWord(lastSide), date: fmtDate(baseE.date) }) : t("compare_note_none", { day: dayWord(lastSide) }))}</p></div>
      <div class="card section trend-card"><h2>${esc(t("trends_top_alliances", { home: homeSrv }))}</h2>
        <div class="table-wrap" style="border:0"><table class="trend-table"><thead><tr><th>${esc(t("col_alliance"))}</th>${evHead}<th class="r hide-sm">${esc(t("col_pts_same_side"))}</th></tr></thead><tbody>
        ${allyRows.map(r => { const a = r.vals[r.vals.length - 1], b = baseIdx >= 0 ? r.vals[baseIdx] : null;
          return `<tr class="clickable" data-open-a="${esc(r.k)}" tabindex="0"><td class="name-cell">${esc(r.name)}</td>${r.vals.map(v => v == null ? `<td class="r dim">—</td>` :
          `<td class="r num">${fmtCompact(v)}<span class="inline-bar"><span style="width:${(v / maxA * 100).toFixed(1)}%;background:var(--home)"></span></span></td>`).join("")}
          <td class="r hide-sm">${a != null && b != null ? deltaHtml(a, b, { compact: true }) : `<span class="dim">—</span>`}</td></tr>`; }).join("")}
        </tbody></table></div></div>
      <div class="card section trend-card"><h2>${esc(t("trends_top_commanders", { home: homeSrv }))}</h2>
        <div class="table-wrap" style="border:0"><table class="trend-table"><thead><tr><th>${esc(t("col_commander"))}</th>${evHead}<th class="r hide-sm">${esc(t("col_rank_prev"))}</th></tr></thead><tbody>
        ${cmdRows.map(r => { const a = r.cells[r.cells.length - 1], b = r.cells[r.cells.length - 2];
          return `<tr class="clickable" data-open-c="${esc(r.k)}" tabindex="0"><td class="name-cell">${esc(r.ref.commander)}<span class="sub">${esc(r.ref.alliance || "")}</span></td>
          ${r.cells.map(c => c ? `<td class="r num">${fmtCompact(c.points)}<span class="sub">#${c.rank}</span></td>` : `<td class="r dim">${esc(t("not_placed"))}</td>`).join("")}
          <td class="r hide-sm">${a && b ? rankMoveHtml(a.rank, b.rank) : ""}</td></tr>`; }).join("")}
        </tbody></table></div></div>`;
    const ch = (id, h, o) => registerChart(document.getElementById(id), () => columnChart(document.getElementById(id), groups,
      [{ label: homeLabel, color: "var(--home)", values: h, tips: tips(e => e.home_server, h), hatch: loaded.map(e => sideOf(e, e.home_server) === "defending") },
       { label: oppLabel, color: "var(--opp)", values: o, tips: tips(e => e.opponent_server, o), hatch: loaded.map(e => sideOf(e, e.opponent_server) === "defending") }]));
    ch("chPts", homePts, oppPts);
    ch("chN", homeN, oppN);
  }

  // ---------- data ----------
  function renderData() {

    document.getElementById("view-data").innerHTML = `
      <div class="grid two">
        <div class="card"><h2>${esc(t("data_title"))}</h2>

            <a class="btn" href="events/${id}/rankings.csv" download="${id}-rankings.csv">${esc(t("dl_rankings_csv"))}</a>
            <a class="btn" href="events/${id}/rankings.json" download="${id}-rankings.json">${esc(t("dl_rankings_json"))}</a>
