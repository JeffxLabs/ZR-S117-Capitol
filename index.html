  // ---------- profiles (drawer on desktop, full-screen sheet on phones) ----------
  const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  let lastFocus = null;
  function openDrawer() {
    if (!drawer.classList.contains("open")) lastFocus = document.activeElement;
    drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    drawer.querySelector(".drawer-body").scrollTop = 0;
    setTimeout(() => document.getElementById("drawerClose").focus({ preventScroll: true }), 30);
  }
  function closeDrawer(silent) {
    drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
    document.body.style.overflow = ""; state.profile = null; hideTip(); if (!silent) syncUrl(true);
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  const loadedEvents = () => EVENTS.filter(e => store[e.id]);
  function historyChart(el, hist, label, color, valueOf, tipOf, server, sub2Of) {
    registerChart(el, () => columnChart(el, hist.map(h => ({ label: fmtDateShort(h.e.date), sub: `${sideShort(sideOf(h.e, server))} · vs S${h.e.opponent_server}`,
                                                           sub2: sub2Of && h.v ? sub2Of(h.v) : "" })),
      [{ label, color, values: hist.map(h => h.v ? valueOf(h.v) : null), tips: hist.map(h => h.v ? tipOf(h) : ""),
         hatch: hist.map(h => sideOf(h.e, server) === "defending") }], { height: 210 }));
  }
  // Average of a value per side across the events played
  function sideAverages(hist, server, valueOf) {
    const out = {};
    for (const side of ["attacking", "defending"]) {
      const vals = hist.filter(h => h.v && sideOf(h.e, server) === side).map(h => valueOf(h.v));
      out[side] = vals.length ? { avg: Math.round(vals.reduce((a, b) => a + b, 0) / vals.length), n: vals.length, best: vals } : null;
    }
    return out;
  }
  function sideTiles(avgs, unit) {
    return ["attacking", "defending"].map(side => tile(t("avg_" + side), avgs[side] ? fmt(avgs[side].avg) : "—",
      `<span aria-hidden="true">${roleIcon(side)}</span> ${esc(nEvents(avgs[side] ? avgs[side].n : 0))}`)).join("");
  }
  function openCommander(key) {
    const byEv = (index && index.c[key]) || {};
    const cur = byEv[state.eventId] || ev().rankings.find(p => cKey(p) === key);
    const any = cur || Object.values(byEv).pop();
    if (!any) return;
    state.profile = { type: "c", key }; syncUrl(true);
    document.getElementById("drawerKind").textContent = t("profile_commander");
    document.getElementById("drawerTitle").textContent = displayName(any.commander);
    const allyK = aKey({ server: any.server, tag: allyTag(any.alliance), alliance: any.alliance });
    document.getElementById("drawerMeta").innerHTML = `${serverPill(any.server)} ${any.alliance ? `<button class="pill" data-open-a="${esc(allyK)}" style="cursor:pointer">${esc(any.alliance)}</button>` : ""}`;
    const hist = loadedEvents().map(e => ({ e, v: byEv[e.id] || (e.id === state.eventId ? cur : null) || null }));
    const played = hist.filter(h => h.v);
    const best = played.length ? Math.min(...played.map(h => h.v.rank)) : null;
    let share = "";
    if (cur) { const a = allyOfPlayer(cur, state.eventId); if (a && a.total_points) share = fmtPct(cur.points / a.total_points); }
    const prevE = prevEventOf(state.eventId), prevV = prevE ? byEv[prevE.id] : null;
    document.getElementById("drawerBody").innerHTML = `
      <div class="grid tiles">
        ${tile(t("this_event"), cur ? `#${cur.server_rank} ${overall(cur.rank, "dim", "font-size:15px")}` : "—", cur ? (prevE ? rankMoveHtml(cur.rank, prevV ? prevV.rank : null, true) : esc(t("col_server_rank"))) : esc(t("not_placed")))}
        ${tile(t("col_points"), cur ? fmt(cur.points) : "—", cur ? (() => { const b = sameSideBaseline(state.eventId, any.server), bv = b && byEv[b.id];
            return EVENTS.length > 1 ? `${bv ? deltaHtml(cur.points, bv.points, { compact: true }) + " " : ""}${vsSameSide(state.eventId, any.server, bv ? b : null)}` : ""; })() : "")}
        ${tile(t("col_share"), share || "—", "")}
        ${tile(t("events_played"), `${played.length} / ${hist.length}`, best ? `${esc(t("best_rank"))}: #${best}` : "")}
        ${sideTiles(sideAverages(hist, any.server, v => v.points))}
      </div>
      <div class="card"><h3>${esc(t("history_points"))}</h3>${sideKey()}<div class="chart" id="chHist"></div></div>
      <div class="card" style="padding:0"><div class="table-wrap" style="border:0"><table>
        <thead><tr><th>${esc(t("col_event"))}</th><th>${esc(t("col_side"))}</th><th class="r">${esc(t("col_rank"))}</th><th class="r">${esc(t("col_points"))}</th><th class="hide-sm">${esc(t("col_alliance"))}</th></tr></thead>
        <tbody>${hist.slice().reverse().map(h => `<tr><td>${esc(fmtDate(h.e.date))}<span class="sub">vs S${esc(h.e.opponent_server)}</span></td><td>${sideHtml(sideOf(h.e, any.server))}</td>
          ${h.v ? `<td class="r num">#${h.v.server_rank} ${overall(h.v.rank, "dim")}</td><td class="r num">${fmt(h.v.points)}</td><td class="hide-sm">${esc(h.v.alliance || "")}</td>` : `<td class="r dim" colspan="3">${esc(t("not_placed"))}</td>`}</tr>`).join("")}</tbody>
      </table></div></div>`;
    openDrawer();
    historyChart(document.getElementById("chHist"), hist, displayName(any.commander), serverColor(any.server), v => v.points,
      h => `<b>${esc(fmtDate(h.e.date))}</b> · ${esc(sideShort(sideOf(h.e, any.server)))}<br>vs S${esc(h.e.opponent_server)} · #${h.v.server_rank} (${esc(t("overall_short", { n: h.v.rank }))})<br>${esc(fmt(h.v.points))} ${esc(t("pts"))}`, any.server);
  }
  function openAlliance(key) {
    const byEv = (index && index.a[key]) || {};
    const cur = byEv[state.eventId] || ev().alliances.find(a => aKey(a) === key);
    const any = cur || Object.values(byEv).pop();
    if (!any) return;
    state.profile = { type: "a", key }; syncUrl(true);
    document.getElementById("drawerKind").textContent = t("profile_alliance");
    document.getElementById("drawerTitle").textContent = any.alliance;
    document.getElementById("drawerMeta").innerHTML = serverPill(any.server);
    const hist = loadedEvents().map(e => ({ e, v: byEv[e.id] || (e.id === state.eventId ? cur : null) || null }));
    const prevE = prevEventOf(state.eventId), prevV = prevE ? byEv[prevE.id] : null;
    // Roster change compares each member's position within this alliance with their position in it last event
    const prevPos = {};
    if (prevV && prevV.members) prevV.members.forEach((m, i) => { prevPos[nameKey(m.commander)] = i + 1; });
    const prevPosOf = m => prevPos[nameKey(m.commander)] != null ? prevPos[nameKey(m.commander)] : null;
    document.getElementById("drawerBody").innerHTML = `
      <div class="grid tiles">
        ${tile(t("this_event"), cur ? `#${cur.server_rank} ${overall(cur.rank, "dim", "font-size:15px")}` : "—", cur && prevE ? rankMoveHtml(cur.rank, prevV ? prevV.rank : null, true) : "")}
        ${(() => { const b = sameSideBaseline(state.eventId, any.server), bv = b && byEv[b.id], note = EVENTS.length > 1 ? vsSameSide(state.eventId, any.server, bv ? b : null) : "";
          const sub = (field, compact) => cur ? `${bv ? deltaHtml(cur[field], bv[field], { compact }) + " " : ""}${note}` : "";
          return tile(t("col_total"), cur ? fmt(cur.total_points) : "—", sub("total_points", true))
            + tile(t("col_members"), cur ? fmt(cur.members_count) : "—", sub("members_count", false))
            + tile(t("col_avg"), cur ? fmt(cur.avg_points) : "—", sub("avg_points", true)); })()}
        ${sideTiles(sideAverages(hist, any.server, v => v.total_points))}
      </div>
      <div class="card"><h3>${esc(t("history_alliance_points"))}</h3>${sideKey()}<div class="chart" id="chHist"></div>
        <div class="table-wrap" style="border:0;margin-top:8px"><table><thead><tr><th>${esc(t("col_event"))}</th><th>${esc(t("col_side"))}</th><th class="r">${esc(t("col_rank"))}</th><th class="r">${esc(t("col_total"))}</th><th class="r hide-sm">${esc(t("col_members"))}</th></tr></thead>
        <tbody>${hist.slice().reverse().map(h => `<tr><td>${esc(fmtDate(h.e.date))}<span class="sub">vs S${esc(h.e.opponent_server)}</span></td><td>${sideHtml(sideOf(h.e, any.server))}</td>
          ${h.v ? `<td class="r num">#${h.v.server_rank} ${overall(h.v.rank, "dim")}</td><td class="r num">${fmt(h.v.total_points)}</td><td class="r num hide-sm">${fmt(h.v.members_count)}</td>` : `<td class="r dim" colspan="3">${esc(t("not_placed"))}</td>`}</tr>`).join("")}</tbody></table></div></div>
      ${cur ? `<div class="card" style="padding:0"><h3 style="padding:14px 14px 0">${esc(t("roster_title"))}</h3><div class="table-wrap" style="border:0"><table>
        <thead><tr><th>${esc(t("col_rank"))}</th><th>${esc(t("col_commander"))}</th><th class="r">${esc(t("col_points"))}</th>${prevE ? `<th class="r">${esc(t("col_change"))}</th>` : ""}</tr></thead>
        <tbody>${cur.members.map((m, i) => `<tr class="clickable" data-open-c="${esc(cKey({ server: any.server, commander: m.commander }))}" tabindex="0">
          <td class="rank-cell"><span class="rk ${rankClass(i + 1)}">#${i + 1}</span>${overall(m.rank)}</td>
          <td class="name-cell">${esc(displayName(m.commander))}</td>
          <td class="r num">${fmt(m.points)}<span class="sub" title="${esc(t("col_share"))}">${cur.total_points ? (m.points / cur.total_points < 0.0005 ? "&lt;0.1%" : fmtPct(m.points / cur.total_points)) : ""}</span></td>
          ${prevE ? `<td class="r">${rankMoveHtml(i + 1, prevPosOf(m))}</td>` : ""}</tr>`).join("")}</tbody></table></div>
        ${prevE ? `<p class="note" style="padding:0 14px 12px">${esc(t("roster_change_note2", { date: fmtDate(prevE.date), day: dayWord(sideOf(prevE, any.server)) || "—" }))}</p>` : ""}</div>` : ""}`;
    openDrawer();
    historyChart(document.getElementById("chHist"), hist, any.alliance, serverColor(any.server), v => v.total_points,
      h => `<b>${esc(fmtDate(h.e.date))}</b> · ${esc(sideShort(sideOf(h.e, any.server)))}<br>vs S${esc(h.e.opponent_server)} · #${h.v.server_rank} (${esc(t("overall_short", { n: h.v.rank }))})<br>${esc(fmt(h.v.total_points))} ${esc(t("pts"))} · ${esc(t("players_n", { n: fmt(h.v.members_count) }))}`,
      any.server, v => t("players_n", { n: fmt(v.members_count) }));
  }

  // ---------- global search ----------
  const gs = document.getElementById("globalSearch"), gsr = document.getElementById("searchResults");
  let gsItems = [], gsSel = -1;
  function closeSearch() { gsr.classList.remove("open"); gs.setAttribute("aria-expanded", "false"); }
  function renderSearch() {
    const q = gs.value.trim().toLowerCase();
    if (!q) { closeSearch(); return; }
    const d = ev();
    const cmds = d.rankings.filter(p => (p.commander || "").toLowerCase().includes(q)).slice(0, 6)
      .map(p => ({ type: "c", key: cKey(p), label: displayName(p.commander), server: p.server, extra: `#${p.rank} · ${p.alliance || ""}` }));
    const allies = d.alliances.filter(a => a.alliance.toLowerCase().includes(q)).slice(0, 4)
      .map(a => ({ type: "a", key: aKey(a), label: a.alliance, server: a.server, extra: `#${a.rank} · ${fmtCompact(a.total_points)}` }));
    gsItems = [...cmds, ...allies]; gsSel = gsItems.length ? 0 : -1;
    gsr.innerHTML = gsItems.length ? gsItems.map((it, i) => `<button type="button" class="sr-item" role="option" id="sr-${i}" aria-selected="${i === gsSel}" data-i="${i}">${serverPill(it.server)}<span class="ellipsis"><b>${esc(it.label)}</b> <span class="dim">${esc(it.extra)}</span></span><span class="sr-kind">${esc(t(it.type === "c" ? "profile_commander" : "profile_alliance"))}</span></button>`).join("")
      : `<div class="dim" style="padding:10px">${esc(t("search_none"))}</div>`;
    gsr.classList.add("open"); gs.setAttribute("aria-expanded", "true");
  }
  function pickSearch(i) {
    const it = gsItems[i]; if (!it) return;
    gs.value = ""; closeSearch(); gs.blur();
    it.type === "c" ? openCommander(it.key) : openAlliance(it.key);
  }
  gs.addEventListener("input", renderSearch);
  gs.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!gsItems.length) return;
      gsSel = (gsSel + (e.key === "ArrowDown" ? 1 : -1) + gsItems.length) % gsItems.length;
      gsr.querySelectorAll(".sr-item").forEach((b, i) => b.setAttribute("aria-selected", i === gsSel));
      gs.setAttribute("aria-activedescendant", "sr-" + gsSel);
    } else if (e.key === "Enter") { e.preventDefault(); pickSearch(gsSel); }
    else if (e.key === "Escape") { gs.value = ""; closeSearch(); }
  });
  gsr.addEventListener("click", e => { const b = e.target.closest(".sr-item"); if (b) pickSearch(+b.dataset.i); });

  // ---------- delegated interactions ----------
  // Tap/click/Enter on a bracketed rank shows its explanation (phones have no hover)
  let ovTimer;
  function showOverallTip(el) {
    const r = el.getBoundingClientRect();
    showTip(esc(t("overall_tip")), r.left - 12, r.top);
    clearTimeout(ovTimer); ovTimer = setTimeout(hideTip, 2500);
  }
  window.addEventListener("scroll", () => { clearTimeout(ovTimer); hideTip(); }, { passive: true, capture: true });
  document.addEventListener("click", e => {
    const ov = e.target.closest(".ov-tip");
    if (ov) { e.preventDefault(); showOverallTip(ov); return; }   // don't open the row's profile
    if (tip.style.display === "block" && !e.target.closest(".chart")) hideTip();
    if (!e.target.closest(".search")) closeSearch();
    const c = e.target.closest("[data-open-c]"); if (c) { openCommander(c.dataset.openC); return; }
    const a = e.target.closest("[data-open-a]"); if (a) { openAlliance(a.dataset.openA); return; }
    const g = e.target.closest("[data-goto]"); if (g) { if (g.dataset.server) state.allyServer = g.dataset.server; setTab(g.dataset.goto); document.querySelector(".tabs-bar").scrollIntoView({ block: "start" }); return; }
    const as = e.target.closest("[data-ally-srv]"); if (as) { state.allyServer = as.dataset.allySrv; renderAlliances(); syncUrl(true); return; }
    const cs = e.target.closest("[data-cmd-srv]"); if (cs) { state.cmdServer = cs.dataset.cmdSrv; state.cmdLimit = 100; renderCommanders(); syncUrl(true); return; }
    const tt = e.target.closest("[data-toggle-table]"); if (tt) { state.trendsTable[tt.dataset.toggleTable] = !state.trendsTable[tt.dataset.toggleTable]; renderTrends(); return; }
    const fl = e.target.closest("#footerLangs [data-lang]"); if (fl) setLanguage(fl.dataset.lang);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".ov-tip")) { e.preventDefault(); showOverallTip(e.target); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-open-c], tr[data-open-a]")) { e.preventDefault(); e.target.click(); }
  });
  document.getElementById("drawerClose").addEventListener("click", () => closeDrawer());
  scrim.addEventListener("click", () => closeDrawer());
  document.getElementById("drawerCopy").addEventListener("click", () => {
    const btn = document.getElementById("drawerCopy"), done = () => { btn.dataset.done = "1"; btn.title = t("link_copied"); setTimeout(() => { delete btn.dataset.done; btn.title = t("copy_link"); }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => {}); else done();
  });
  document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); });
  document.getElementById("tabs").addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const tabs = [...document.querySelectorAll(".tab")], i = tabs.findIndex(b => b.dataset.tab === state.tab);
    const n = tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
    setTab(n.dataset.tab); n.focus();
  });
  document.getElementById("eventSelect").addEventListener("change", e => selectEvent(e.target.value));
  const themeBtn = document.getElementById("themeToggle");
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeBtn.setAttribute("aria-pressed", theme === "light");
    const label = theme === "light" ? t("theme_night") : t("theme_day");
    themeBtn.setAttribute("aria-label", label); themeBtn.title = label;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f4f4f2" : "#000000");
  }
  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    try { localStorage.setItem("s117.theme", next); } catch (e) {}
    applyTheme(next); syncUrl(false);
  });
  document.getElementById("langSelect").addEventListener("change", e => setLanguage(e.target.value));

  function setLanguage(lang) {
    if (!I18N[lang]) return;
    state.lang = lang;
    try { localStorage.setItem("s117.lang", lang); } catch (e) {}
    const profile = state.profile;
    renderAll();
    if (profile) { restoring = true; (profile.type === "c" ? openCommander : openAlliance)(profile.key); restoring = false; syncUrl(false); }
  }
  function selectEvent(id) {
    state.eventId = id; state.allyServer = "all"; state.cmdServer = "all"; state.allyQuery = ""; state.cmdQuery = ""; state.cmdLimit = 100;
    if (drawer.classList.contains("open")) closeDrawer(true);
    loadEvent(id).then(() => { renderAll(); syncUrl(true); });
  }
  function renderTab() {
    charts.length = 0;
    ({ overview: renderOverview, alliances: renderAlliances, commanders: renderCommanders, trends: renderTrends, data: renderData }[state.tab] || renderOverview)();
  }
  function renderAll() { applyStaticText(); applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark"); renderEventBar(); setTab(state.tab, false); syncUrl(false); }

  // ---------- boot ----------
  state.lang = detectLanguage();
  readUrlState(params);
  if (!state.eventId) { document.getElementById("view-overview").textContent = "No events published yet."; return; }
  loadEvent(state.eventId).then(() => {
    renderAll();
    return Promise.all(EVENTS.map(e => loadEvent(e.id).catch(() => null)));
  }).then(() => {
    index = buildIndex();
    renderTab();   // vs-previous deltas and trends need every event
    restoring = true; openProfileFromUrl(params); restoring = false; syncUrl(false);
  });
})();
</script>
</body>
</html>
